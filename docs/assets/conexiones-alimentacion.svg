e="14" font-weight="600" fill="#c86a24">J5 · +6V_SERVO</text></g><g class="edge" data-from="fusePi" data-to="regulator"><path d="M960 350V425" fill="none" stroke="#c86a24" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr3)" /><rect x="855.5" y="374" width="209" height="23" rx="5" fill="#fcfdfb"/><text x="960" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#c86a24">J6 · batería al regulador</text></g><g class="edge" data-from="regulator" data-to="pi"><path d="M980 545V625" fill="none" stroke="#237b55" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr1)" /><rect x="883.3" y="572" width="193.4" height="23" rx="5" fill="#fcfdfb"/><text x="980" y="588" text-anchor="middle" font-size="14" font-weight="600" fill="#237b55">5,1 V regulados · USB-C</text></g><g class="edge" data-from="pi" data-to="logic"><path d="M980 745V815" fill="none" stroke="#237b55" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr1)" /><rect x="906.7" y="767" width="146.6" height="23" rx="5" fill="#fcfdfb"/><text x="980" y="783" text-anchor="middle" font-size="14" font-weight="600" fill="#237b55">J12 · 5 V / 3,3 V</text></g><g class="node" data-id="battery" role="button" tabindex="0" aria-label="Ver conexiones de Batería LiPo 3S" aria-pressed="false"><title>Batería LiPo 3S · J1 · Entrada XT60</title><rect class="node-box" x="40" y="50" width="240" height="115" rx="12" fill="#fff" stroke="#d6dfd2"/><rect x="40" y="67" width="4" height="81" rx="2" fill="#c86a24"/><text class="code" x="60" y="78" font-size="12" font-weight="600" fill="#c86a24">J1</text><text x="60" y="109" font-size="21" font-weight="650" fill="#172b25">Batería LiPo 3S</text><text x="60" y="134" font-size="14" fill="#66776d">Hasta 12,6 V cargada</text><text x="257" y="78" font-size="17" fill="#9aab95">↗</text></g><g class="node" data-id="mainSwitch" role="button" tabindex="0" aria-label="Ver conexiones de Interruptor general" aria-pressed="false"><title>Interruptor general · 